version: '3.8'

services:
  omega-db:
    image: postgres:14-alpine
    container_name: omega-db
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${OMEGA_DB_PASSWORD:-omega_secret_password}
      POSTGRES_DB: omega_monadpulse
    volumes:
      - omega-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different port to avoid conflict with main DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  omega-engine:
    build: .
    container_name: omega-engine
    depends_on:
      omega-db:
        condition: service_healthy
    environment:
      OMEGA_DATABASE_URL: postgresql://trader:${OMEGA_DB_PASSWORD:-omega_secret_password}@omega-db/omega_monadpulse
      MONAD_RPC_URL: ${MONAD_RPC_URL:-http://localhost:8545}
      OMEGA_API_PORT: 8001
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"  # Omega API port
    restart: unless-stopped
    volumes:
      - ./:/app

volumes:
  omega-db-data:
