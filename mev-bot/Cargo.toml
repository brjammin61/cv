[package]
name = "mev-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana
solana-sdk = "1.18"
solana-client = "1.18"
solana-rpc-client = "1.18"

# Async
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenv = "0.15"

# Utilities
bs58 = "0.5"
chrono = "0.4"
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
base64 = "0.21"

# Math
num-traits = "0.2"

[lib]
name = "mev_bot"
path = "src/lib.rs"

[[bin]]
name = "mev-bot"
path = "src/main.rs"
