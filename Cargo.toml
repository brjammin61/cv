[workspace]
resolver = "2"
members = [
    "crates/ore-bus",
    "crates/ore-miner",
    "crates/ore-strategist",
    "crates/ore-jito",
    "crates/ore-state-monitor",
    "crates/ore-treasury",
    "crates/ore-common",
    "crates/ore-solver-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ORE V2 Dominance Team"]
license = "MIT"

[workspace.dependencies]
# Solana dependencies
solana-sdk = "1.18"
solana-client = "1.18"
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"
anchor-lang = "0.29"
anchor-client = "0.29"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Messaging
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Crypto
sha3 = "0.10"
blake3 = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
dotenv = "0.15"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Metrics
prometheus = "0.13"

# Utils
chrono = "0.4"
bs58 = "0.5"
base64 = "0.21"
hex = "0.4"

# FFI
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
