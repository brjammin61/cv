[workspace]
members = [
    "ore-bot",
    "modules/cost-engine",
    "modules/price-oracle",
    "modules/swap-executor",
    "modules/miner-control",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ORE Arbitrage Bot"]

[workspace.dependencies]
# Solana dependencies
solana-sdk = "1.18"
solana-client = "1.18"
solana-rpc-client = "1.18"
solana-account-decoder = "1.18"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
dotenv = "0.15"

# Utilities
bs58 = "0.5"
chrono = "0.4"
